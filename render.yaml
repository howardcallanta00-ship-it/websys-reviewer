# Render Blueprint: one free static site.
# Static sites on Render have no paid instance type, so no `plan` is set.
services:
  - type: web
    name: websys-reviewer
    runtime: static
    # Validates every lesson, question and cross-link before publishing.
    # No dependencies are installed; it only needs Node, which Render provides.
    buildCommand: node scripts/check.mjs
    staticPublishPath: ./public
    pullRequestPreviewsEnabled: false
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=3600
    routes:
      # The app uses hash routes (#/learn/m1), so every real path serves index.html.
      - type: rewrite
        source: /*
        destination: /index.html
