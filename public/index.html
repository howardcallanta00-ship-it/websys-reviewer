<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IT0049 Reviewer</title>
  <meta name="description" content="Reviewer for IT0049 Web System Technologies: CodeIgniter 4 and Laravel, modules 1 to 8. Lessons with annotated code, practice exams, flashcards and a CodeIgniter-to-Laravel translator.">
  <meta name="theme-color" content="#F4F1EA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#121316" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Source+Serif+4:opsz,wght@8..60,600;8..60,700&display=swap">
  <link rel="stylesheet" href="assets/css/app.css">
  <script>
    // Apply saved theme and text size before first paint to avoid a flash.
    try {
      var s = JSON.parse(localStorage.getItem('it0049-reviewer-v1') || '{}').settings || {};
      if (s.theme === 'light' || s.theme === 'dark') document.documentElement.setAttribute('data-theme', s.theme);
      if (s.size) document.documentElement.setAttribute('data-size', s.size);
    } catch (e) {}
  </script>
  <script type="module" src="assets/js/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>

      <a href="#/learn" data-nav="learn">Lessons</a>

      <button type="submit" aria-label="Search">
        <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
      </button>
    </form>
    <a class="iconlink" href="#/settings" data-nav="settings" aria-label="Settings">

    </a>
  </header>
  <main id="main" tabindex="-1">
